<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - ComplaintAI</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="style.css">

</head>


<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center px-4">


    <!-- Background Effects -->

    <div class="absolute inset-0 overflow-hidden pointer-events-none">

        <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl"></div>

        <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-violet-600/20 rounded-full blur-3xl"></div>

    </div>


    <!-- Login Card -->

    <main class="relative z-10 w-full max-w-md">


        <div class="text-center mb-8">


            <!-- Logo -->

            <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-blue-600 to-violet-600 flex items-center justify-center shadow-lg shadow-blue-500/30">

                <i class="fa-solid fa-brain text-3xl"></i>

            </div>


            <h1 class="text-3xl font-extrabold mt-5">

                ComplaintAI

            </h1>


            <p class="text-slate-400 text-sm mt-2">

                Company Operations Login

            </p>

        </div>



        <!-- Card -->

        <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 shadow-2xl">


            <div class="mb-6">

                <h2 class="text-xl font-bold">

                    Sign in

                </h2>

                <p class="text-sm text-slate-400 mt-1">

                    Enter your account credentials to continue.

                </p>

            </div>



            <!-- Error -->

            <div id="loginError"
                 class="hidden mb-5 p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-sm">

                <i class="fa-solid fa-circle-exclamation mr-2"></i>

                <span id="loginErrorText">

                    Invalid email or password.

                </span>

            </div>



            <!-- Login Form -->

            <form id="loginForm"
                  class="space-y-5">


                <!-- Email -->

                <div>

                    <label class="block text-sm font-semibold mb-2">

                        Email

                    </label>


                    <div class="relative">

                        <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>


                        <input
                            id="email"
                            type="email"
                            autocomplete="email"
                            placeholder="admin@company.com"
                            required
                            class="w-full pl-11 pr-4 py-3.5 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">

                    </div>

                </div>



                <!-- Password -->

                <div>

                    <label class="block text-sm font-semibold mb-2">

                        Password

                    </label>


                    <div class="relative">

                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>


                        <input
                            id="password"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Enter your password"
                            required
                            class="w-full pl-11 pr-12 py-3.5 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">


                        <button
                            type="button"
                            onclick="togglePassword()"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300">

                            <i id="passwordIcon"
                               class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>



                <!-- Login Button -->

                <button
                    id="loginButton"
                    type="submit"
                    class="w-full py-3.5 rounded-xl bg-gradient-to-r from-blue-600 to-violet-600 hover:from-blue-500 hover:to-violet-500 text-white font-bold shadow-lg shadow-blue-500/20 transition flex items-center justify-center gap-2">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    <span id="loginButtonText">
                        Sign In
                    </span>

                </button>


            </form>



            <!-- Demo Credentials -->

            <div class="mt-7 pt-6 border-t border-slate-800">

                <p class="text-xs text-slate-500 text-center mb-3">

                    Development account

                </p>


                <div class="bg-slate-800/70 rounded-xl p-4 text-xs">

                    <div class="flex justify-between mb-2">

                        <span class="text-slate-500">
                            Email
                        </span>

                        <span class="font-mono text-slate-300">
                            admin@company.com
                        </span>

                    </div>


                    <div class="flex justify-between">

                        <span class="text-slate-500">
                            Password
                        </span>

                        <span class="font-mono text-slate-300">
                            Admin@12345
                        </span>

                    </div>

                </div>

            </div>

        </div>


        <p class="text-center text-xs text-slate-600 mt-6">

            ComplaintAI • Secure Company Access

        </p>

    </main>



    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            const icon =
                document.getElementById("passwordIcon");


            if (password.type === "password") {

                password.type = "text";

                icon.className =
                    "fa-solid fa-eye-slash";

            } else {

                password.type = "password";

                icon.className =
                    "fa-solid fa-eye";

            }

        }



        function showError(message) {

            document.getElementById("loginErrorText")
                .textContent = message;

            document.getElementById("loginError")
                .classList.remove("hidden");

        }



        function hideError() {

            document.getElementById("loginError")
                .classList.add("hidden");

        }



        document.getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                hideError();


                const email =
                    document.getElementById("email")
                        .value.trim();

                const password =
                    document.getElementById("password")
                        .value;


                const button =
                    document.getElementById("loginButton");

                const buttonText =
                    document.getElementById("loginButtonText");


                button.disabled = true;

                buttonText.textContent = "Signing in...";


                try {

                    const response = await fetch(
                        "/api/auth/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            credentials: "same-origin",

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );


                    const data =
                        await response.json();


                    if (!response.ok || !data.authenticated) {

                        showError(
                            data.error ||
                            "Invalid email or password."
                        );

                        return;

                    }


                    /*
                     * COMPANY USER
                     */

                    if (data.role === "ROLE_COMPANY") {

                        window.location.href =
                            "/company.html";

                        return;

                    }


                    /*
                     * CUSTOMER USER
                     */

                    if (data.role === "ROLE_CUSTOMER") {

                        window.location.href =
                            "/complaint.html";

                        return;

                    }


                    showError(
                        "Your account does not have an allowed role."
                    );


                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    showError(
                        "Unable to connect to the server."
                    );


                } finally {

                    button.disabled = false;

                    buttonText.textContent =
                        "Sign In";

                }

            });

    </script>


</body>

</html>
